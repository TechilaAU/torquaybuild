<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Torquay Building Supplies</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/images/tbs-logo-shield.svg">
  <link rel="apple-touch-icon" href="/images/icon-180.png">
  <meta name="theme-color" content="#1C203E">
  <link rel="stylesheet" href="/css/shared.css">
  <style>
    .not-found { min-height:60vh; display:flex; align-items:center; justify-content:center; padding:80px 24px; background:var(--off-white); }
    .not-found-card { background:var(--white); border-radius:var(--radius-md); border:1px solid var(--grey-light); box-shadow:var(--shadow-lg); padding:56px 48px; text-align:center; max-width:520px; width:100%; }
    .not-found-card h1 { font-family:var(--font-display); font-weight:900; font-size:5rem; color:var(--blue-deep); line-height:1; margin-bottom:8px; }
    .not-found-card h2 { font-family:var(--font-display); font-weight:900; font-size:1.6rem; text-transform:uppercase; color:var(--navy); margin-bottom:12px; }
    .not-found-card p { color:var(--grey-dark); margin-bottom:28px; }
    .not-found-actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  </style>
</head>
<body>
<header>
  <div class="header-inner">
    <a class="logo-wrap" href="/"><img src="/images/tbs-logo-shield.svg" alt="Torquay Building Supplies" width="95" height="56" style="height:56px;width:auto;"></a>
  </div>
</header>
<div class="not-found">
  <div class="not-found-card">
    <h1>404</h1>
    <h2>Page Not Found</h2>
    <p>The page you're looking for doesn't exist or has been moved.</p>
    <div class="not-found-actions">
      <a href="/" class="btn btn-primary">Go Home</a>
      <a href="/products/" class="btn btn-navy">Browse Products</a>
      <a href="/contact/" class="btn btn-outline" style="color:var(--navy);border-color:var(--grey-light);">Contact Us</a>
    </div>
  </div>
</div>
<script src="/js/shared.js"></script>
</body>
</html>
